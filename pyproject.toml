[project]
name = "scraper-framework"
version = "0.1.0"
description = "Extensible scraping framework: a small stable core, swappable components, config-driven plugins."
readme = "CONTRIBUTING.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49.0.0",
    "cssselect>=1.4.0",
    "httpx>=0.28.1",
    "jsonpath-ng>=1.8.0",
    "lxml>=6.1.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "playwright>=1.61.0",
    "prometheus-client>=0.25.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "lxml-stubs>=0.5.1",
    "types-pyyaml>=6.0.12.20260518",
]

[project.scripts]
scraper = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "components", "plugins", "cli"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer's documented pattern uses function calls in argument defaults
"cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["core", "components", "plugins", "cli"]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["jsonpath_ng.*", "pymupdf.*", "fitz.*", "playwright.*"]
ignore_missing_imports = true

# The Playwright fetcher and login providers call into Playwright's dynamically
# typed browser objects, which cannot satisfy strict mode.
[[tool.mypy.overrides]]
module = ["components.fetchers.playwright_fetcher", "components.auth.form_login"]
disallow_untyped_calls = false
disallow_any_explicit = false

# These two modules call into libraries that ship without type annotations
# (pymupdf, jsonpath-ng), so calls into them cannot satisfy strict mode.
[[tool.mypy.overrides]]
module = ["components.parsers.pdf_parser", "components.documents.json_document"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
