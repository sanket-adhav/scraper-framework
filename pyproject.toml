[project]
name = "scraper-framework"
version = "0.1.0"
description = "Extensible scraping framework: a small stable core, swappable components, config-driven plugins."
readme = "CONTRIBUTING.md"
requires-python = ">=3.12"
dependencies = [
    "cssselect>=1.4.0",
    "jsonpath-ng>=1.8.0",
    "lxml>=6.1.1",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "lxml-stubs>=0.5.1",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "components", "plugins", "cli"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["core", "components", "plugins", "cli"]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["jsonpath_ng.*", "pymupdf.*", "fitz.*"]
ignore_missing_imports = true

# These two modules call into libraries that ship without type annotations
# (pymupdf, jsonpath-ng), so calls into them cannot satisfy strict mode.
[[tool.mypy.overrides]]
module = ["components.parsers.pdf_parser", "components.documents.json_document"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
