name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy, strict on core)
        run: uv run mypy

      - name: Architecture boundary (import-linter)
        run: uv run lint-imports --config importlinter.ini

      - name: Tests (pytest)
        run: uv run pytest -q
