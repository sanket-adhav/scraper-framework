name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scraper
          POSTGRES_PASSWORD: scraper
          POSTGRES_DB: scraper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scraper:scraper@localhost:5432/scraper_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Playwright Chromium (for the browser e2e test)
        run: uv run playwright install --with-deps chromium

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy, strict on core)
        run: uv run mypy

      - name: Architecture boundary (import-linter)
        run: uv run lint-imports --config importlinter.ini

      - name: Tests (pytest)
        run: uv run pytest -q
