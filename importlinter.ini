; The architectural boundary from plan2.md §8 — machine-enforced, not aspirational.
; CI runs `lint-imports` on every PR; a violation fails the build.

[importlinter]
root_packages =
    core
    components
    plugins
    cli

; Rule 1+: layering. core sits at the bottom and imports nothing above it;
; components never import plugins or cli.
[importlinter:contract:layers]
name = core < components < (plugins | cli)
type = layers
layers =
    (plugins) | (cli)
    components
    core

; Rule 2: components may use only core.contracts, core.models, core.errors —
; never the engine, pipeline, registry, plugin manager, events, config, scheduler.
[importlinter:contract:components-surface]
name = components import only the core contracts surface
type = forbidden
source_modules =
    components
forbidden_modules =
    core.engine
    core.pipeline
    core.registry
    core.plugin
    core.events.bus
    core.config
    core.scheduler

; Rule 3: plugins may use only the core contracts surface and components.
[importlinter:contract:plugins-surface]
name = plugins import only the core contracts surface and components
type = forbidden
source_modules =
    plugins
forbidden_modules =
    cli
    core.engine
    core.pipeline
    core.registry
    core.plugin
    core.events.bus
    core.config
    core.scheduler

; Rule 4: plugins never import each other.
[importlinter:contract:plugins-independence]
name = plugins are independent of each other
type = independence
modules =
    plugins.ecommerce_example
    plugins.api_example
    plugins.news_feed
