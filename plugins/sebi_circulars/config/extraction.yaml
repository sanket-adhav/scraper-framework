pipeline: [fetch, parse, discover, extract, validate, persist]

urls:
  - "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=1&ssid=${category_id}&smid=0&search=${title}&fromDate=${from_date}&toDate=${to_date}"

fetcher: http
fetcher_options:
  timeout_s: 30
  default_headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    Referer: "https://www.sebi.gov.in/"

middleware: [retry, rate_limit]

engine:
  max_requests: ${max_results}

plugin:
  name: sebi_circulars
  version: 0.1.0

discover:
  next_url:
    kind: xpath
    query: "//table[@id='sample_1']//tr/td[2]/a/@href"

extract:
  schema_version: "1"
  spec:
    date:
      kind: css
      query: "div.date_value h5"
      cleanup: [collapse_whitespace, strip]
    title:
      kind: css
      query: "section.department-slider h1"
      cleanup: [collapse_whitespace, strip]
    pdf_link:
      kind: xpath
      query: "//iframe/@src"

validate:
  validators:
    - name: required_field
      options: {fields: [title, pdf_link]}
    - name: business_rule
      options:
        rules:
          - field: title
            op: contains
            value: "${title}"

error_policy:
  stages:
    extract:
      ExtractionError: skip
      UnsupportedSelectorError: skip
    validate:
      ValidationError: discard
    persist:
      PersistError: skip

persist:
  repositories:
    - name: file
      options:
        output_dir: "output/pdfs/sebi"
        url_field: "pdf_link"
        filename_field: "title"
        date_field: "date"
    - name: json
      options:
        path: "output/circulars.json"
        key_fields: [pdf_link]
        mode: upsert
        indent: 2