pipeline: [fetch, parse, discover, extract, validate, persist]

# SEBI Circulars-only listing page (Legal → Circulars)
# 💡 PRO TIP: You can pass a search keyword directly to SEBI's server using &search=
# This is much faster than scraping 50 items and filtering — it pre-filters instantly!
urls:
  - "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=1&ssid=7&smid=0&search=Specialized+Investment+Funds"

fetcher: http
fetcher_options:
  timeout_s: 30
  default_headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    Referer: "https://www.sebi.gov.in/"

middleware: [retry, rate_limit]

engine:
  max_requests: 50

plugin:
  name: sebi_circulars
  version: 0.1.0

discover:
  next_url:
    kind: xpath
    query: "//table[@id='sample_1']//tr/td[2]/a/@href"

extract:
  schema_version: "1"
  spec:
    date:
      kind: css
      query: "div.date_value h5"
      cleanup: [collapse_whitespace, strip]
    title:
      kind: css
      query: "section.department-slider h1"
      cleanup: [collapse_whitespace, strip]
    pdf_link:
      kind: xpath
      query: "//iframe/@src"

validate:
  validators:
    - name: required_field
      options: {fields: [title, pdf_link]}
    - name: business_rule
      options:
        rules:
          - field: title
            op: contains
            value: "Certification Requirements for Distribution of Specialized Investment Funds (SIFs)"
          # - field: date
          #   op: contains
          #   value: "Jul 21, 2026"

error_policy:
  stages:
    extract:
      ExtractionError: skip        # no fields found → skip this URL
      UnsupportedSelectorError: skip
    validate:
      ValidationError: discard    # title doesn't match → silently drop, no quarantine file
    persist:
      PersistError: skip

persist:
  repositories:
    - name: file
      options:
        output_dir: "output/pdfs/sebi"
        url_field: "pdf_link"
        filename_field: "title"
        date_field: "date"
    - name: json
      options:
        path: "output/circulars.json"
        key_fields: [pdf_link]
        mode: upsert
        indent: 2