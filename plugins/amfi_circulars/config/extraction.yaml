# AMFI Circulars — scrapes AMFI Best Practice circulars and guidelines.
# Uses the Playwright fetcher because amfiindia.com renders content via JavaScript.
#
# Source: https://www.amfiindia.com/distributor/amfi-circulars
# Replaces: Compliance/backend/common_scrapers/amfi_dynamic_scraper.py (185 lines)

pipeline: [fetch, parse, discover, extract, validate, transform, persist]

urls:
  - "https://www.amfiindia.com/distributor/amfi-circulars"

# No parser declared — AutoParser handles HTML and PDF dynamically

# AMFI uses JavaScript rendering, so we need the Playwright fetcher
fetcher: playwright
fetcher_options:
  timeout_s: 60

engine:
  max_requests: 5

plugin:
  name: amfi_circulars
  version: 0.1.0

discover:
  next_url:
    kind: xpath
    query: "//div[count(div) = 3]//div[2]//a[contains(@href, '.pdf')]/@href"

extract:
  schema_version: "1"
  spec:
    reference:
      kind: regex
      query: "((?:AMFI/)?(?:MFD-)?CIR/(?:ARN-)?\\d+/\\d{2,4}-\\d{2,4})"
    date:
      kind: regex
      query: "((?:January|February|March|April|May|June|July|August|September|October|November|December)\\s+\\d{1,2},\\s+\\d{4}|\\d{1,2}\\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\\s+\\d{4})"
      cleanup: [collapse_whitespace, strip]
    title:
      kind: regex
      query: "(?:Subject:|Dear\\s+Sir/\\s*Madam,|Dear\\s+Members,)\\s*([A-Za-z0-9 ,./-]{15,120})"
      cleanup: [collapse_whitespace, strip]
    pdf_link:
      kind: regex
      query: "(.*)"
      against: url

validate:
  validators:
    - name: required_field
      options: {fields: [date, title, pdf_link]}

error_policy:
  stages:
    extract:
      ExtractionError: skip
    validate:
      ValidationError: skip
    transform:
      TransformError: skip
    persist:
      PersistError: skip

persist:
  repositories:
    - name: file
      options:
        output_dir: "output/pdfs/amfi"
        url_field: "pdf_link"
        filename_field: "title"
    - name: json
      options:
        path: "output/amfi_circulars.json"
        mode: upsert
        key_fields: [title]
        indent: 2
