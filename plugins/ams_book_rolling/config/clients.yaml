# ==============================================================================
# AMS — Client roster (§1 client count, §4 client quality)
# Source: /Clients — a master/detail screen, NOT a grid. The left rail lists
# client names only; contact details live in the detail pane for the selected
# client. This config captures the roster; per-client contact/tenure fields
# require visiting /Clients/{id} and are tracked as a known gap (see README).
# ==============================================================================

pipeline: [fetch, parse, extract, validate, transform, persist]

urls:
  - "http://localhost:5577/Clients"

fetcher: authenticated_playwright
fetcher_options:
  login_url: "http://localhost:5577/Account/Login"
  username: "secret://env/AMS_EMAIL"
  password: "secret://env/AMS_PASSWORD"
  username_selector: 'input[name="Input.Email"]'
  password_selector: 'input[name="Input.Password"]'
  submit_selector: 'button.submitbtn[type="submit"]'
  logged_out_selector: 'input[name="Input.Password"]'
  wait_selector: ".client-list-item"
  wait_after_s: 3.0
  timeout_s: 60

parser: html

extractor: table
extractor_options:
  collections:
    # The roster: one entry per client in the left rail.
    clients:
      # No <td> inside these divs, so the extractor falls back to the row
      # element's own text — which is exactly the client name.
      rows: '//div[contains(@class,"client-list-item")]'
      columns: [client_name]

    # Whichever client the app auto-selects renders a full detail header.
    # Captured opportunistically to prove the detail-pane selectors work.
    selected_client:
      rows: '//div[contains(@class,"client-header-container")]'
      columns:
        client_name: ".client-name"
        contact_links: ".top-rowtwo"

extract:
  schema_version: "1"
  spec:
    page_title:
      kind: css
      query: "title"
      required: false
      cleanup: [collapse_whitespace, strip]

middleware:
  - retry
middleware_options:
  retry:
    max_attempts: 3

engine:
  max_requests: 2

plugin:
  name: ams_book_rolling
  version: 0.1.0

validate:
  validators:
    - name: required_field
      options: {fields: [collections]}

error_policy:
  stages:
    extract:
      ExtractionError: skip
    validate:
      ValidationError: skip

persist:
  repositories:
    - name: json
      options:
        path: "output/ams/clients.json"
        mode: upsert
        key_fields: [source_url]
        indent: 2
