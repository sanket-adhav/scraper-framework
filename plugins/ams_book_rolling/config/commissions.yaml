# ==============================================================================
# AMS — Commission summary (§2 financial valuation, §8 commission per carrier)
# Source: /Reports/Commissions — two aggregate tables (by status, by carrier).
# Tables are matched on a distinctive header cell, not position, so adding a
# third panel to the page will not silently shift the mapping.
# ==============================================================================

pipeline: [fetch, parse, extract, validate, transform, persist]

urls:
  - "http://187.127.129.18:5577/Reports/Commissions"

fetcher: authenticated_playwright
fetcher_options:
  login_url: "http://187.127.129.18:5577/Account/Login"
  username: "secret://env/AMS_EMAIL"
  password: "secret://env/AMS_PASSWORD"
  username_selector: 'input[name="Input.Email"]'
  password_selector: 'input[name="Input.Password"]'
  submit_selector: 'button.submitbtn[type="submit"]'
  logged_out_selector: 'input[name="Input.Password"]'
  wait_selector: "table.billing-table tbody tr"
  wait_after_s: 2.5
  timeout_s: 60

parser: html

extractor: table
extractor_options:
  collections:
    # The multi-year revenue trend a buyer prices the book on.
    by_year:
      rows: '//table[.//th[normalize-space()="Year"]]//tbody/tr'
      columns: [year, statements, expected, received, yoy_growth]
    by_status:
      rows: '//table[.//th[normalize-space()="Status"]]//tbody/tr'
      columns: [status, statements, expected, received, variance]
    by_carrier:
      rows: '//table[.//th[normalize-space()="Carrier"]]//tbody/tr'
      columns: [carrier, statements, match_rate, expected, received, variance]

extract:
  schema_version: "1"
  spec:
    page_title:
      kind: css
      query: "title"
      required: false
      cleanup: [collapse_whitespace, strip]

middleware:
  - retry
middleware_options:
  retry:
    max_attempts: 3

engine:
  max_requests: 2

plugin:
  name: ams_book_rolling
  version: 0.1.0

validate:
  validators:
    - name: required_field
      options: {fields: [collections]}

error_policy:
  stages:
    extract:
      ExtractionError: skip
    validate:
      ValidationError: skip

persist:
  repositories:
    - name: json
      options:
        path: "output/ams/commissions.json"
        mode: upsert
        key_fields: [source_url]
        indent: 2
