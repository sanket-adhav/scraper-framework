# ==============================================================================
# AMS — Policies grid (§1 book size, §5 renewal calendar, §6 loss-ratio premium)
# Source: /Policies — FluentUI data grid, client-side paged (~18 rows/page).
# The fetcher clicks through every page and splices the rows into one table.
# ==============================================================================

pipeline: [fetch, parse, extract, validate, transform, persist]

urls:
  - "http://localhost:5577/Policies"

fetcher: authenticated_playwright
fetcher_options:
  login_url: "http://localhost:5577/Account/Login"
  username: "secret://env/AMS_EMAIL"
  password: "secret://env/AMS_PASSWORD"
  username_selector: 'input[name="Input.Email"]'
  password_selector: 'input[name="Input.Password"]'
  submit_selector: 'button.submitbtn[type="submit"]'
  logged_out_selector: 'input[name="Input.Password"]'
  wait_selector: "table.fluent-data-grid tbody tr"
  wait_after_s: 3.0
  timeout_s: 60
  # In-page pagination: walk every page, merge rows into the first table.
  paginate_next_selector: 'fluent-button[title="Go to next page"]:not([disabled])'
  paginate_row_container: "table.fluent-data-grid tbody"
  paginate_row_selector: "tr"
  paginate_max_pages: 25

parser: html

extractor: table
extractor_options:
  collections:
    policies:
      # Header-keyed so an added/reordered grid does not shift the match.
      rows: '//table[contains(@class,"fluent-data-grid")]//tbody/tr'
      columns:
        - policy_id
        - policy_number
        - line_type
        - carrier_name
        - wholesaler_name
        - effective_date
        - expiration_date
        - client_name
        - premium
        - status

# TableExtractor reads its rows from extractor_options; this spec only carries
# the schema version and a page marker (the extract section is mandatory).
extract:
  schema_version: "1"
  spec:
    page_title:
      kind: css
      query: "title"
      required: false
      cleanup: [collapse_whitespace, strip]

middleware:
  - retry
middleware_options:
  retry:
    max_attempts: 3

engine:
  max_requests: 2

plugin:
  name: ams_book_rolling
  version: 0.1.0

validate:
  validators:
    - name: required_field
      options: {fields: [collections]}

error_policy:
  stages:
    extract:
      ExtractionError: skip
    validate:
      ValidationError: skip

persist:
  repositories:
    - name: json
      options:
        path: "output/ams/policies.json"
        mode: upsert
        key_fields: [source_url]
        indent: 2
