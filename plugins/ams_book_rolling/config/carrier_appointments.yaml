# ==============================================================================
# AMS — Carrier appointments (§8 carrier relationships & transferability)
# Source: /Reports/CarrierAppointments — premium share, average commission rate
# and appointment transferability per carrier.
# ==============================================================================

pipeline: [fetch, parse, extract, validate, transform, persist]

urls:
  - "http://localhost:5577/Reports/CarrierAppointments"

fetcher: authenticated_playwright
fetcher_options:
  login_url: "http://localhost:5577/Account/Login"
  username: "secret://env/AMS_EMAIL"
  password: "secret://env/AMS_PASSWORD"
  username_selector: 'input[name="Input.Email"]'
  password_selector: 'input[name="Input.Password"]'
  submit_selector: 'button.submitbtn[type="submit"]'
  logged_out_selector: 'input[name="Input.Password"]'
  wait_selector: "table.billing-table tbody tr"
  wait_after_s: 2.5
  timeout_s: 60

parser: html

extractor: table
extractor_options:
  collections:
    by_carrier:
      rows: '//table[.//th[normalize-space()="Transferable"]]//tbody/tr'
      columns:
        - carrier
        - policies
        - premium
        - pct_of_book
        - commission_rate
        - transferable

extract:
  schema_version: "1"
  spec:
    page_title:
      kind: css
      query: "title"
      required: false
      cleanup: [collapse_whitespace, strip]

middleware:
  - retry
middleware_options:
  retry:
    max_attempts: 3

engine:
  max_requests: 2

plugin:
  name: ams_book_rolling
  version: 0.1.0

validate:
  validators:
    - name: required_field
      options: {fields: [collections]}

error_policy:
  stages:
    extract:
      ExtractionError: skip
    validate:
      ValidationError: skip

persist:
  repositories:
    - name: json
      options:
        path: "output/ams/carrier_appointments.json"
        mode: upsert
        key_fields: [source_url]
        indent: 2
