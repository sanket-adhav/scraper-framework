# api_example — deliberately different from ecommerce_example in fetch (API),
# parse (JSON), and pagination (cursor → discover stage). Same engine, same
# extractor class, zero core changes: that's the Phase-1 proof.

pipeline: [fetch, parse, discover, extract, validate, transform, persist]

urls:
  - "file://products_page1.json"

fetcher: local_file
fetcher_options:
  root: "plugins/api_example/fixtures"

parser: json

plugin:
  name: api_example
  version: 1.0.0

# Cursor pagination: each page names the next one; the last page simply doesn't.
discover:
  next_url:
    kind: jsonpath
    query: "$.pagination.next"
  url_template: "file://{value}"

extract:
  schema_version: "1"
  spec:
    title:
      kind: jsonpath
      query: "$.product.name"
    brand:
      kind: jsonpath
      query: "$.product.brand"
    price:
      kind: jsonpath
      query: "$.product.price.value"
      cleanup: [to_float]
    currency:
      kind: jsonpath
      query: "$.product.price.currency"
    sku:
      kind: jsonpath
      query: "$.product.id"
    rating:
      kind: jsonpath
      query: "$.product.rating.score"
      cleanup: [to_float]
    review_count:
      kind: jsonpath
      query: "$.product.rating.count"
      cleanup: [to_int]
      required: false

validate:
  validators:
    - name: required_field
      options: {fields: [title, price, sku]}
    - name: business_rule
      options:
        rules:
          - {field: price, op: ">", value: 0}
          - {field: currency, op: in, value: [INR, USD, EUR]}
    - name: duplicate
      options: {key_fields: [sku]}

transform:
  transformers:
    - name: field_enricher
      options:
        constants: {source: shopverse_api}

persist:
  repositories:
    - name: jsonl
      options:
        path: "output/api_example.jsonl"
        mode: upsert
        key_fields: [sku]

# --- config-spec test wiring (auto-discovered by tests/config_specs) ---
fixture: products_page1.json
sample_url: "file://products_page1.json"
expect:
  title: "Aurora X2 Wireless Headphones"
  brand: "Aurora"
  price: 4999.0
  currency: "INR"
  sku: "B0AURX2HDX"
  rating: 4.4
  review_count: 1284
