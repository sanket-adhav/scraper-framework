# SEBI Gazette Notifications — scrapes gazette notifications from the
# dedicated gazette section of SEBI's website.
#
# Source: https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=1&ssid=82&smid=0
# Replaces: Compliance/backend/common_scrapers/gazette_scraper.py (214 lines)

pipeline: [fetch, parse, discover, extract, validate, transform, persist]

urls:
  - "https://www.sebi.gov.in/sebiweb/home/HomeAction.do?doListing=yes&sid=1&ssid=82&smid=0"

# No parser declared — AutoParser handles HTML and PDF dynamically

fetcher: playwright
fetcher_options:
  timeout_s: 60

middleware:
  - retry
  - rate_limit

middleware_options:
  retry:
    max_attempts: 3
  rate_limit:
    rate: 1.0

engine:
  max_requests: 5

plugin:
  name: sebi_gazette
  version: 0.1.0

discover:
  next_url:
    kind: xpath
    query: "//table[@id='sample_1']//tr/td[2]/a/@href"

extract:
  schema_version: "1"
  spec:
    date:
      kind: css
      query: "div.date_value h5"
      cleanup: [collapse_whitespace, strip]
    type:
      kind: xpath
      query: "//ol[@class='cfc-breadcrumb']/li[last()]/text()"
      cleanup: [collapse_whitespace, strip]
    title:
      kind: css
      query: "section.department-slider h1"
      cleanup: [collapse_whitespace, strip]
    pdf_link:
      kind: xpath
      query: "//iframe/@src"

validate:
  validators:
    - name: required_field
      options: {fields: [date, title, pdf_link]}

error_policy:
  stages:
    extract:
      ExtractionError: skip
      UnsupportedSelectorError: skip
    validate:
      ValidationError: skip
    transform:
      TransformError: skip
    persist:
      PersistError: skip

persist:
  repositories:
    - name: file
      options:
        output_dir: "output/pdfs/gazette"
        url_field: "pdf_link"
        filename_field: "title"
    - name: jsonl
      options:
        path: "output/sebi_gazette.jsonl"
        mode: upsert
        key_fields: [title]
