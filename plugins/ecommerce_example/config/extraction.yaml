# ecommerce_example — the whole plugin is this file (plan2.md §7: config, not code).
# Exercises: CSS, XPath, regex-on-URL, cleanup chains, required/optional fields.

pipeline: [fetch, parse, extract, validate, transform, persist]

urls:
  - "file://product_aurora_x2.html"
  - "file://product_nimbus_pods.html"

fetcher: local_file
fetcher_options:
  root: "plugins/ecommerce_example/fixtures"

parser: html

plugin:
  name: ecommerce_example
  version: 1.0.0

extract:
  schema_version: "1"
  spec:
    title:
      kind: css
      query: "h1#product-title span"
      cleanup: [collapse_whitespace]
    price:
      kind: xpath
      query: "//span[@class='price']/text()"
      cleanup: [strip_currency, to_float]
    sku:
      kind: xpath
      query: "//main[@id='product-page']/@data-sku"
    rating:
      kind: xpath
      query: "//div[@class='rating']/@data-score"
      cleanup: [to_float]
    product_file:
      kind: regex
      query: "([a-z0-9_]+)\\.html"
      against: url
    discount_pct:
      kind: regex
      query: "(\\d+)% off"
      cleanup: [to_int]
      required: false
    availability:
      kind: css
      query: "span.stock"

validate:
  validators:
    - name: required_field
      options: {fields: [title, price, sku]}
    - name: business_rule
      options:
        rules:
          - {field: price, op: ">", value: 0}
          - {field: rating, op: "<=", value: 5}
    - name: duplicate
      options: {key_fields: [sku]}

transform:
  transformers:
    - name: text_cleaner
    - name: enum_mapper
      options:
        mappings:
          availability: {"In stock": in_stock, "Out of stock": out_of_stock}
    - name: field_enricher
      options:
        constants: {source: shopverse}

persist:
  repositories:
    - name: postgres
      options:
        dsn: "secret://env/DATABASE_URL"
        table: "ecommerce_example"
        mode: upsert
        key_fields: [sku]

# --- config-spec test wiring (auto-discovered by tests/config_specs) ---
fixture: product_aurora_x2.html
sample_url: "file://product_aurora_x2.html"
expect:
  title: "Aurora X2 Wireless Headphones"
  price: 4999.0
  sku: "B0AURX2HDX"
  rating: 4.4
  product_file: "product_aurora_x2"
  discount_pct: 23
  availability: "In stock"
