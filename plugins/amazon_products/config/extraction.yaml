# ==============================================================================
# Amazon Best Sellers Scraper Configuration
# Source: https://www.amazon.in/gp/bestsellers/electronics/
# ==============================================================================

# 1. PIPELINE STAGES: 7-step assembly line
pipeline: [fetch, parse, discover, extract, validate, transform, persist]

# 2. SEED URLS: Target Amazon Best Sellers page
urls:
  - "https://www.amazon.in/gp/bestsellers/electronics/"

# 3. FETCHER: Playwright Chrome browser to render JavaScript
fetcher: playwright
fetcher_options:
  timeout_s: 60
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  wait_after_s: 3.0

# 4. PARSER: AutoParser automatically routes HTML content

# 5. MIDDLEWARE: Retries on network failure and limits request rate
middleware:
  - retry
  - rate_limit

middleware_options:
  retry:
    max_attempts: 3
  rate_limit:
    rate: 1.0

# 6. ENGINE: Limits max requests (1 listing page + 5 product pages = 6)
engine:
  max_requests: 6

# 7. PLUGIN METADATA: Identifier for this scraper
plugin:
  name: amazon_products
  version: 0.1.0

# 8. DISCOVER STAGE: XPath rule to extract unique product detail page URLs
discover:
  next_url:
    kind: xpath
    query: "//div[@id='gridItemRoot']//a[contains(@href, '/dp/') and @tabindex='-1']/@href"

# 9. EXTRACT STAGE: Field selectors for product title, price, rating, availability
extract:
  schema_version: "1"
  spec:
    title:
      kind: css
      query: "#productTitle"
      cleanup: [collapse_whitespace, short_title]
    price:
      kind: css
      query: "span.a-price-whole"
      cleanup: [collapse_whitespace, format_inr_price]
      required: false
    rating:
      kind: css
      query: "span.a-icon-alt"
      cleanup: [collapse_whitespace, strip]
      required: false
    availability:
      kind: css
      query: "#availability span"
      cleanup: [collapse_whitespace, strip]
      required: false

# 10. VALIDATE STAGE: Ensures required title exists (skips listing page)
validate:
  validators:
    - name: required_field
      options: {fields: [title]}

# 11. ERROR POLICY: Action rules for stage failures
error_policy:
  stages:
    extract:
      ExtractionError: skip
    validate:
      ValidationError: skip
    transform:
      TransformError: skip
    persist:
      PersistError: skip

# 12. PERSIST STAGE: Saves output to formatted JSON and CSV files
persist:
  repositories:
    - name: json
      options:
        path: "output/amazon_bestsellers.json"
        mode: upsert
        key_fields: [title]
        indent: 2
    - name: csv
      options:
        path: "output/amazon_bestsellers.csv"
        mode: upsert
        key_fields: [title]
